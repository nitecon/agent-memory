app: memory
title: Agent Memory CLI and MCP context
summary: SQLite-canonical OKF concepts, virtual Markdown bundles, hybrid/graph retrieval, WorkingContext handoff, and capability-gated gateway exchange.
kind: agent_context
source_format: agent_context
source_ref: .agent/api/memory.yaml
labels:
  - agent-memory
  - memory
  - cli
  - mcp
  - working-context
  - gateway-sync
  - all-scope-sync
  - okf
  - knowledge-graph
content:
  purpose: >
    The memory binary stores every durable project/global memory as a canonical
    OKF concept in SQLite and exposes ranked context retrieval for AI agents.
    Markdown documents, indexes, and logs are virtual projections over the
    database; physical files are explicit interchange only. WorkingContext is a separate
    per-project handoff row for transient active-work state; it is not a
    durable memory and does not participate in ranking or dream curation.
    Gateway exchange moves durable memories between machines: default scoped
    push/pull operates on the current project ident, while explicit --all mode
    syncs all durable-memory project idents. memory store can run best-effort
    automatic push-then-pull for the stored project when the gateway is
    configured, and explicit push/pull commands remain the manual diagnostic
    and retry surface. Scoped push/pull excludes __global__; all-scope
    push/pull includes __global__ as the durable global scope. WorkingContext
    state is always excluded.
  workflows:
    - name: Work with canonical OKF memory
      steps:
        - Render a memory with memory okf get <id>; this creates no physical file.
        - Validate or dry-run a proposed document before mutation.
        - Apply with memory okf put <id> --file PATH --expect-revision N for compare-and-swap safety.
        - Browse generated indexes/logs with memory okf list, read, index, and log against an okf+memory bundle URI.
        - Audit immutable revisions with history/diff and traverse bounded typed relationships with graph.
        - Use export/import only for explicit physical interchange; SQLite remains canonical.
    - name: Start a task
      steps:
        - Run memory context "<task>" from the project directory.
        - Read any leading <working_context present="true"> block as the authoritative active handoff.
        - Treat project_memories as durable project knowledge and general_knowledge as global user directives.
    - name: Leave a handoff
      steps:
        - Replace the current handoff with memory working set "current state and next step".
        - Use memory working set - < handoff.md for multiline stdin bodies.
        - Keep durable decisions and reusable lessons in memory store, not only in WorkingContext.
    - name: Store and auto-sync project memory
      steps:
        - Configure the shared gateway with memory setup gateway or agent-tools setup gateway.
        - Leave AGENT_MEMORY_GATEWAY_AUTO_SYNC unset or true to use the default-on behavior when URL/API key exist.
        - Run memory store from a project directory; project-scoped stores push pending local memories and then pull remote memories.
        - If auto-sync emits a retry hint, the local store succeeded; use memory push or memory pull manually to retry gateway exchange.
    - name: Mutate synced memories
      steps:
        - Leave AGENT_MEMORY_GATEWAY_AUTO_SYNC unset or true to make memory update and memory forget write directly to the gateway when URL/API key exist.
        - memory update <id> --content ... rewrites the local row first, then pushes that single updated memory to the gateway; on gateway failure the local update remains and memory push is the retry surface.
        - memory forget --id or --query pushes a gateway tombstone before deleting a linked local row; if the tombstone fails, the local row is kept so the delete can be retried safely.
        - If a linked row is deleted locally without a successful direct gateway tombstone, memory records a pending delete queue item so the next memory push or memory push --all can tombstone the gateway record.
        - memory-dream uses the same direct gateway write helpers for condense rewrites, forget/drop decisions, and superseded memories when gateway auto-sync is enabled.
    - name: Run Dream curation safely
      steps:
        - Configure headless.model and use {model} in headless.command so execution and audit identity share one source of truth.
        - Scheduled passes are unlimited by default so every eligible memory is considered; use memory-dream --limit N only when deliberately splitting coverage across multiple passes.
        - Treat dream_skipped reason=already_running as a healthy no-op and any non-zero process exit as a failed pass.
        - Ensure scheduled environments can resolve the configured headless binary; Dream suppresses automatic memory and agent-tools hooks in its child process.
    - name: Clear a completed handoff
      steps:
        - Run memory working clear when the project thread completes or the user directs cleanup.
        - Confirm memory working get returns present="false".
    - name: Push durable memories to the gateway
      steps:
        - Configure the shared gateway with memory setup gateway or agent-tools setup gateway.
        - Environment overrides also work via AGENT_MEMORY_GATEWAY_*, AGENT_GATEWAY_*, or GATEWAY_*.
        - Run memory push status to inspect local current-project memories that would be sent; this status command does not contact the gateway.
        - Run memory push --all status to inspect all local durable-memory project idents that would be sent, including __global__ and projects that only have pending gateway deletes; this status command does not contact the gateway.
        - Run memory push to POST pending create/update/delete records for the current project.
        - Run memory push --all to POST pending create/update/delete records for every local durable-memory project ident or pending-delete project ident, including __global__.
        - Keep host, OS, agent, and client-origin metadata in GatewayMemory.provenance, not in normal memory tags.
        - Resolve any conflict results reported by the gateway before expecting the local sync metadata to advance.
    - name: Pull durable memories from the gateway
      steps:
        - Configure the shared gateway with memory setup gateway or agent-tools setup gateway.
        - Environment overrides also work via AGENT_MEMORY_GATEWAY_*, AGENT_GATEWAY_*, or GATEWAY_*.
        - Run memory pull status to fetch current-project remote diffs and print the local plan without writing local memory rows or sync metadata.
        - Run memory pull --all status to discover remote project idents from the gateway, then print each per-project plan without writing local memory rows or sync metadata.
        - Run memory pull to import, link, fast-forward, or mark tombstone metadata for non-conflicting current-project gateway memories.
        - Run memory pull --all to import, link, fast-forward, or mark tombstone metadata for every gateway-discovered project ident, including projects that do not exist locally yet and __global__ when present.
        - Resolve conflicts before expecting the project pull cursor to advance.
    - name: Publish this API context
      steps:
        - Validate with agent-tools docs validate --file .agent/api/memory.yaml.
        - Publish with agent-tools docs publish --file .agent/api/memory.yaml.
  auth:
    gateway_memory_exchange:
      shared_config:
        system: /opt/agentic/agent-tools/gateway.conf
        user: ~/.agentic/agent-tools/gateway.conf
        setup:
          - memory setup gateway
          - agent-tools setup gateway
      base_url_env:
        preferred: AGENT_MEMORY_GATEWAY_URL
        fallback:
          - AGENT_GATEWAY_URL
          - GATEWAY_URL
      api_key_env:
        preferred: AGENT_MEMORY_GATEWAY_API_KEY
        fallback:
          - AGENT_GATEWAY_API_KEY
          - GATEWAY_API_KEY
      auto_sync_config:
        key: AGENT_MEMORY_GATEWAY_AUTO_SYNC
        alias: MEMORY_GATEWAY_AUTO_SYNC
        default: true when gateway URL and API key are configured.
        disable_values:
          - "false"
          - "0"
          - "no"
          - "off"
      okf_capability:
        key: AGENT_MEMORY_GATEWAY_OKF
        alias: MEMORY_GATEWAY_OKF
        default: false
        behavior: When explicitly true, send a versioned okf-markdown envelope and semantic hash alongside all legacy fields.
      transport: Authorization Bearer token on gateway HTTP requests.
  cli:
    commands:
      - name: memory-dream
        purpose: Curate durable memories through project review, deduplication, and condensation while preserving OKF revisions and graph provenance.
        args:
          optional:
            - --limit N
            - --dry-run
            - --refresh|--full
            - --backend headless|local|disabled
            - --model LOCAL_MODEL
            - --headless-model MODEL
            - --command-override TEMPLATE
        behavior:
          - Only one pass may own the database-adjacent run lock; concurrent passes emit dream_skipped with reason already_running.
          - Passes are unlimited by default; when explicitly supplied, the limit is global across projects, and zero also means unlimited.
          - Headless subprocesses receive AGENT_MEMORY_HOOK=off, AGENT_TOOLS_HOOK=off, and MEMORY_DREAM_HEADLESS=1.
          - condenser_version uses the backend-qualified inference identity plus prompt hash.
          - Dream-created relationship producer and revision actor are both memory-dream.
          - A terminal summary with failed greater than zero is followed by a non-zero process exit.
      - name: memory okf
        purpose: Operate on SQLite-canonical OKF concepts through virtual Markdown document and bundle handlers.
        subcommands:
          validate: Validate an OKF Markdown document without mutation or execution.
          get: Render one canonical memory as OKF Markdown without creating a file.
          put: Create/update from --file or stdin; supports --dry-run and --expect-revision CAS.
          read: Read a virtual document or generated bundle path.
          list: List a virtual bundle directory.
          index: Render the root, OKF type, or tag index.
          log: Render paginated immutable bundle history.
          history: List immutable revisions for one memory.
          diff: Compare two immutable revisions.
          graph: Traverse bounded typed relationships with relation, direction, depth, and limit filters.
          export: Materialize an explicit physical bundle; refuses unsafe paths, secrets, and existing destinations.
          import: Validate and ingest a physical bundle through canonical handlers; supports --dry-run.
        bundle_uris:
          - okf+memory://project/<project>
          - okf+memory://global
          - okf+memory://unscoped
        invariants:
          - SQLite is authoritative; documents, indexes, and logs are projections.
          - /memories/<uuid>.md is writable; generated index and log paths are read-only.
          - WorkingContext is not addressable.
          - Attested Computation metadata is validated but never executed.
      - name: memory store
        purpose: Store a durable memory with embedding and lexical index rows.
        args:
          required:
            - content
          optional:
            - --tags
            - --okf-file
            - --project
            - --agent
            - --source-file
            - --memory-type user|feedback|project|reference
            - --no-project
            - --scope project|global
        output: <result status="stored" id="..." scope="..." project="..."/> followed by optional <result status="gateway_auto_sync" .../> when gateway auto-sync runs.
        behavior:
          - Project-scoped stores automatically push pending local project memories, then pull remote project memories, when gateway URL/API key are configured and AGENT_MEMORY_GATEWAY_AUTO_SYNC is not false.
          - Auto-sync is best-effort; gateway failures do not undo the local store and are rendered as hints with manual memory push/pull retry guidance.
          - Global and unscoped stores are excluded from gateway auto-sync.
      - name: memory search
        purpose: Hybrid BM25/vector search with current-project and global boosts.
        args:
          required:
            - query
          optional:
            - -k/--limit
            - --project
            - --only
            - --no-project-boost
            - --type
            - --tag
            - --graph-depth
        output: Grouped light-XML sections project_memories, general_knowledge, other_projects.
      - name: memory context
        purpose: Task-start retrieval. Includes active WorkingContext before ranked memories.
        args:
          required:
            - description
          optional:
            - -k/--limit
            - --project
            - --only
            - --no-project-boost
            - --type
            - --tag
            - --graph-depth
        output: Optional <working_context present="true"> block, grouped memory sections, hints, and usage.
      - name: memory push status
        purpose: Show durable memories that would be created, updated, or deleted on the gateway for the current project, or for every local durable-memory project ident when --all is set.
        args:
          optional:
            - --all
        output: Light-XML gateway_push section with create/update/skipped counts and per-memory entries; --all mode is grouped or repeated by project ident.
        behavior:
          - Local read-only status; does not require gateway configuration and does not write sync metadata.
          - Scoped mode excludes the reserved __global__ project, unscoped memories, and WorkingContext state.
          - --all mode includes every local durable-memory project ident, including __global__, plus projects with pending gateway deletes; WorkingContext and unscoped memories remain excluded.
      - name: memory push
        purpose: Send pending durable memories to the gateway as arrays of memory structs for the current project, or for every local durable-memory project ident when --all is set.
        args:
          optional:
            - --all
            - --batch-size
        output: Light-XML gateway_push section followed by push_result entries and push_complete when nothing is pending; --all mode is grouped or repeated by project ident.
        behavior:
          - Posts create/update candidates from live local rows and delete candidates from memory_gateway_delete_queue; skipped rows are not sent.
          - Direct mutation helpers can also send one-record tombstone pushes for linked rows being forgotten or superseded.
          - Successful deleted, tombstoned, or gateway-updated tombstone results clear the pending delete queue and any remaining local sync metadata.
          - Records local sync metadata only for created, updated, or linked gateway results on live rows.
          - Leaves local sync metadata unchanged for conflict or rejected gateway results.
          - Scoped mode requires a non-global current project ident and configured gateway URL/API key.
          - --all mode walks every local durable-memory project ident, including __global__, and does not require a cwd-derived current project.
          - WorkingContext and unscoped memories are never pushed.
          - Host, OS, agent, and client-origin metadata belongs in GatewayMemory.provenance, not GatewayMemory.tags.
      - name: memory pull status
        purpose: Fetch remote memory diffs from the gateway and print the local pull plan for the current project, or for gateway-discovered project idents when --all is set, without mutating local storage.
        args:
          optional:
            - --all
        output: Light-XML gateway_pull section with import/link/update/conflict/tombstone/rejected counts and per-memory entries; --all mode is grouped or repeated by project ident.
        behavior:
          - Contacts the gateway because status depends on remote diffs.
          - Does not insert memories, update memories, write sync metadata, or advance the project pull cursor.
          - Scoped mode excludes global memories and WorkingContext by validating all remote records against the current project.
          - --all mode discovers remote project idents from the gateway before planning, so projects that do not exist locally can still be pulled.
          - --all mode includes __global__ when the gateway reports it; WorkingContext remains excluded.
      - name: memory pull
        purpose: Apply non-conflicting gateway memory diffs locally for the current project, or for gateway-discovered project idents when --all is set.
        args:
          optional:
            - --all
        output: Light-XML gateway_pull section followed by pull_complete with conflict and cursor_updated attributes; --all mode is grouped or repeated by project ident.
        behavior:
          - Imports new remote records under the current project ident.
          - Links exact duplicate project memories by content hash.
          - Fast-forwards local rows only when the current local content hash still matches the recorded base hash.
          - Reports conflicts without modifying the conflicted memory or advancing the project pull cursor.
          - Records tombstone metadata but does not delete local memory content.
          - --all mode first discovers remote project idents from the gateway and then applies the same per-project pull rules to each ident, including projects absent locally and __global__ when present.
      - name: memory recall
        purpose: Structured filtering by project, agent, tags, and memory type.
      - name: memory get
        purpose: Fetch full content for one or more full UUIDs or 4+ character ID prefixes.
      - name: memory list
        purpose: List recent memories, optionally by project or memory type.
      - name: memory forget
        purpose: Delete memories by ID or by top search matches.
        behavior:
          - If gateway auto-sync is enabled and the memory has gateway sync metadata, pushes a tombstone for the linked gateway memory before deleting locally.
          - If that tombstone push conflicts, is rejected, or fails transport/config validation, the local row is kept so a retry still has gateway ID and base revision metadata.
          - Unlinked or unscoped memories delete locally without contacting the gateway.
          - Auto-sync-disabled linked memories delete locally without contacting the gateway, but leave a pending gateway delete for a later manual memory push.
      - name: memory prune
        purpose: Delete stale/low-access memories, with dry-run support.
      - name: memory move
        purpose: Reassign project idents on one memory or all memories from a project.
        behavior:
          - Project-wide moves transfer the source WorkingContext row to the target project when one exists.
          - Moving a project to the unscoped empty-string target deletes the source WorkingContext row.
          - If the target project already has WorkingContext, the project-wide move fails before moving durable memories.
          - Single-memory moves do not affect WorkingContext.
      - name: memory copy
        purpose: Duplicate one memory or all memories from a project under another project ident.
        behavior:
          - Does not copy WorkingContext; copied handoffs require an explicit memory working set.
      - name: memory projects
        purpose: List distinct project idents and memory counts.
        behavior:
          - Lists durable memory projects only; WorkingContext-only projects are omitted.
      - name: memory update
        purpose: With no ID, run the self-updater; with ID plus --content, re-author a memory.
        behavior:
          - The content-update form rewrites and re-embeds the local row first.
          - If gateway auto-sync is enabled and the memory has a project/global scope, pushes that single updated memory to the gateway immediately.
          - Gateway push failure is rendered as a retry hint and does not roll back the local update; memory push remains the manual retry surface.
      - name: memory setup
        purpose: Configure the shared gateway connection and install/remove injected agent rules and bundled skill guidance.
      - name: memory working get
        purpose: Read the current project's WorkingContext.
        args:
          optional:
            - --project
        output:
          present: <working_context project="..." version="..." updated_at="..." present="true">full content</working_context>
          absent: <working_context project="..." present="false"/>
        behavior:
          - Exits successfully for valid projects even when no row exists.
      - name: memory working set
        purpose: Replace the current project's WorkingContext.
        args:
          required_one_of:
            - inline content
            - "-"
            - --file PATH
          optional:
            - --project
        output: <result status="working_context_set" project="..." version="..." updated_at="..."/>
        behavior:
          - Content arg "-" reads stdin.
          - Enforces a 65536 character cap.
          - Rejects missing project idents and __global__.
      - name: memory working clear
        purpose: Delete the current project's WorkingContext row.
        args:
          optional:
            - --project
        output: <result status="working_context_cleared" project="..." deleted="true|false"/>
        behavior:
          - Idempotent when no row exists.
  mcp:
    tools:
      - name: memory_store
        purpose: Store a durable memory. Mirrors memory store except MCP currently rejects explicit project="__global__".
      - name: memory_search
        purpose: Hybrid ranked memory search.
      - name: memory_context
        purpose: Task-start retrieval with optional leading WorkingContext block.
      - name: memory_recall
        purpose: Structured memory filtering.
      - name: memory_get
        purpose: Fetch full memory bodies by full UUID or 4+ character prefix.
      - name: memory_forget
        purpose: Delete memories by ID or search query.
      - name: memory_prune
        purpose: Prune stale/low-access memories.
      - name: memory_move
        purpose: Reassign memory project idents; project-wide moves also transfer or delete WorkingContext.
      - name: memory_copy
        purpose: Duplicate memory rows under another project ident; WorkingContext is not copied.
      - name: memory_projects
        purpose: List distinct durable-memory project idents.
      - name: memory_working_get
        purpose: Read WorkingContext; returns present="true" with full content or present="false" when absent.
      - name: memory_working_set
        purpose: Replace WorkingContext; enforces the 65536 character cap and project-only scope.
      - name: memory_working_clear
        purpose: Delete WorkingContext; idempotent when absent.
      - name: okf_validate
        purpose: Validate OKF Markdown without mutation, fetching, or computation execution.
      - name: okf_get
        purpose: Render one canonical SQLite memory as virtual OKF Markdown.
      - name: okf_put
        purpose: Create/update a canonical concept with dry-run and expected-revision CAS support.
      - name: okf_list
        purpose: List virtual bundle entries and generated paths.
      - name: okf_history
        purpose: List immutable semantic revisions for one memory.
      - name: okf_diff
        purpose: Compare two immutable revisions deterministically.
      - name: okf_graph
        purpose: Traverse bounded typed relationships by direction, relation, depth, and limit.
    resources:
      uri_templates:
        - okf+memory://project/<project>/<path>
        - okf+memory://global/<path>
        - okf+memory://unscoped/<path>
      mime_type: text/markdown
      writable_paths: /memories/<uuid>.md via okf_put
      read_only_paths: Generated root/type/tag indexes and log.
      excludes: WorkingContext
  contracts:
    okf_native_memory:
      canonical_store: SQLite durable-memory and OKF relational tables.
      text_model: The memory body is Markdown-compatible text; Markdown files are virtual or explicit interchange projections.
      type_distinction:
        memory_type: Closed agent-memory behavior class; user, feedback, project, or reference.
        okf_type: Arbitrary concept classification such as Runbook, Decision, or Reference.
      revisions:
        semantics: Every semantic mutation creates an immutable revision; semantic no-ops do not.
        compare_and_swap: expected_revision mismatch fails without mutation.
        verification: Semantic rewrites, including Dream condensation, clear verification for explicit re-attestation.
      trust_and_freshness:
        trust: Human verification ranks above machine verification above unverified.
        stale: stale_after concepts are downranked.
        deprecated: Excluded from normal search.
      graph:
        storage: Typed directed relationships with unresolved references retained for diagnosis.
        traversal: Text-seeded, cycle-safe, and bounded by depth/result/fan-out budgets.
      dream:
        actor: memory-dream
        preservation: Sources, extensions, and unrelated relationships survive condensation.
        contradictions: Preserve both concepts and surface a review finding.
      execution_boundary: External links are not fetched and Attested Computation metadata is never executed.
      working_context: Fully excluded from OKF documents, resources, graphs, export, Dream, and gateway envelopes.
      recovery:
        migrations: Whole upgrade chain is transactional; failure preserves prior schema/data and can be retried on reopen.
        indexes: FTS segments and generated bundle indexes are derived and rebuildable.
        conflicts: Reread and reconcile; no last-writer-wins overwrite.
        interchange: Dry-run first; exports refuse existing destinations and unsafe/secret-bearing content.
    gateway_memory_exchange:
      scope:
        scoped_mode:
          included: Current-project durable memories only.
          excluded:
            - Global memories stored under __global__.
            - WorkingContext rows.
            - Unscoped memories with no project ident.
        all_scope_mode:
          push_source: All local durable-memory project idents, including __global__.
          pull_source: Gateway-discovered remote project idents, including idents absent locally and __global__ when present.
          excluded:
            - WorkingContext rows.
            - Unscoped local memories with no project ident.
      endpoints:
        - method: POST
          path: /v1/projects/{project}/memories/push
          request: PushMemoriesRequest
          response: PushMemoriesResponse
        - method: POST
          path: /v1/projects/{project}/memories/pull
          request: PullMemoriesRequest
          response: PullMemoriesResponse
        - method: GET
          path: /v1/memories/projects
          request: none
          response: ListMemoryProjectsResponse
      remote_project_discovery:
        required_for: memory pull --all and memory pull --all status.
        contract: Gateway returns durable-memory project idents visible to the caller before the client issues per-project pull requests.
        notes:
          - Discovery must include remote projects that have no local rows yet.
          - Discovery must include __global__ when remote global memories exist.
          - WorkingContext-only projects are not memory-sync projects.
      schemas:
        PushMemoriesRequest:
          required:
            - memories
          fields:
            route_project: Current project ident in /v1/projects/{project}; --all mode may also send __global__.
            memories: Array of GatewayMemory structs. Each item serializes project as project_ident for gateway validation.
        PushMemoriesResponse:
          required:
            - project_ident
            - server_revision
            - results
          fields:
            project_ident: Current project ident.
            server_revision: Project-wide gateway memory revision after the batch.
            results: Array of per-memory created, updated, linked, deleted/tombstoned, conflict, or rejected results.
        PullMemoriesRequest:
          required: []
          fields:
            route_project: Current project ident in /v1/projects/{project}; --all mode may also pull __global__ when discovered by the gateway.
            since_revision: Optional server revision watermark from project_gateway_sync_state.
            known: Optional array of known gateway_memory_id, server_revision, and content_hash values.
            page_size: Optional maximum remote records; CLI defaults to 100.
            include_tombstones: Gateway defaults to true.
        PullMemoriesResponse:
          required:
            - project_ident
            - memories
          fields:
            project_ident: Current project ident.
            memories: Array of active GatewayMemory structs.
            tombstones: Array of tombstone records that the client converts into tombstone pull plans.
            next_since_revision: Gateway watermark corresponding to this page.
            server_revision: Optional project-wide gateway revision to persist only when pull has no conflicts.
            has_more: True when the gateway has more records after this page.
        GatewayMemory:
          required:
            - project_ident
            - content
            - memory_type
            - content_hash
          optional:
            - tags
            - local_memory_id
            - client_id
            - gateway_memory_id
            - base_gateway_revision
            - server_revision
            - created_at
            - updated_at
            - provenance
            - tombstone
            - concept_hash
            - okf
          compatibility:
            - memory accepts project as an alias for project_ident on responses.
            - memory accepts base_server_revision as an alias for base_gateway_revision on responses.
            - content_hash is the gateway-compatible lowercase SHA-256 hex digest of content bytes, with no sha256: prefix.
            - memory serializes created_at and updated_at to the gateway as Unix epoch milliseconds, and accepts either epoch milliseconds or RFC3339 strings on responses.
            - Direct forget/supersede flows send tombstone.deleted=true with gateway_memory_id and base_gateway_revision before hiding or deleting the local row.
            - Deferred delete pushes synthesize tombstone.deleted=true from memory_gateway_delete_queue after the local row has been deleted or superseded.
            - OKF fields are omitted unless AGENT_MEMORY_GATEWAY_OKF or MEMORY_GATEWAY_OKF is explicitly true.
            - A capable payload retains legacy content/content_hash and adds concept_hash plus an okf envelope with version=1, format=okf-markdown, revision, semantic_hash, canonical document text, and extension fields.
            - New clients accept legacy records with no OKF envelope; legacy conflict and tombstone planning continues to use content_hash during transition.
            - Unknown OKF envelope fields survive pull, semantic no-op, and later push.
            - Secret markers in the canonical OKF document block concept-aware gateway transmission.
          guidance:
            - tags are content/domain labels only; do not add hostnames, OS names, source machines, or client-origin labels to tags.
            - origin metadata belongs in provenance.
        GatewayMemoryProvenance:
          optional:
            - source_agent_id
            - source_machine_id
            - source_os
            - source_arch
            - source_system
            - pushed_at
          guidance:
            - Use source_agent_id for the pushing agent identity.
            - Use source_machine_id for host or machine identity.
            - Use source_os for the operating system name reported by the pushing client.
            - Use source_arch for the CPU architecture reported by the pushing client.
            - Use source_system for the memory client/system.
            - Use pushed_at for the gateway push timestamp.
      deconfliction:
        push: Client sends base_server_revision when linked; gateway returns conflict for stale updates.
        pull: Client updates only when local content hash matches last_pulled_content_hash or last_pushed_content_hash.
    durable_memory:
      scopes:
        project: Default; cwd-derived project ident unless overridden.
        global: Stored under reserved project ident __global__ via memory store --scope global.
      retrieval:
        current_project_boost: 1.5
        global_boost: 1.25
        cross_project_results: Allowed and labeled as prior art.
    working_context:
      storage: project_working_context table keyed by project.
      scope: Project-only; __global__ is invalid.
      size_limit: 65536 characters using SQLite LENGTH(content) semantics.
      clear_semantics: Delete the row; no tombstone in v1.
      ranking: Never part of BM25/vector search and never consumes top-k.
      context_output: Active row renders before project_memories with full content.
      absent_output: memory working get returns present="false"; memory context adds only a hint.
      project_ident_maintenance:
        move_from_to: memory move --from X --to Y transfers X's row to Y.
        move_from_to_empty: memory move --from X --to "" deletes X's row because WorkingContext cannot be unscoped.
        move_target_conflict: If Y already has a row, the move fails before durable memories are moved.
        copy: memory copy never duplicates WorkingContext.
        projects: memory projects lists durable memory rows only, not WorkingContext-only projects.
      omitted_v1:
        - append command
        - status command/tool
        - CAS or --expect-version
        - updated_by column
        - cleared_at tombstone
        - hardcoded stale hints
  safety:
    - WorkingContext is transient handoff. Store durable lessons with memory store.
    - Do not write huge handoffs; the 65536 character cap protects every future memory context call.
    - Do not use __global__ for WorkingContext; cross-project handoff state is intentionally unsupported.
    - Do not put host, OS, machine, agent, or client-origin metadata in normal memory tags; use GatewayMemory.provenance fields.
    - Do not rely on memory for git history, releases, tags, CI state, or version facts.
    - SQLite is canonical for durable OKF concepts; do not treat exported Markdown as a live second source of truth.
    - OKF parsing never authorizes execution or external fetches.
  examples:
    - name: Render canonical OKF memory
      command: memory okf get <uuid>
    - name: CAS-protected OKF update
      command: memory okf put <uuid> --file memory.md --expect-revision 3
    - name: Read virtual project index
      command: memory okf read okf+memory://project/agent-memory /index.md
    - name: Traverse memory graph
      command: memory okf graph <uuid> --direction both --depth 2
    - name: Dry-run physical interchange
      command: memory okf export okf+memory://project/agent-memory ./export --dry-run
    - name: Read task context
      command: memory context "continue WorkingContext implementation" -k 8
    - name: Set multiline handoff
      command: memory working set - --project agent-memory < handoff.md
    - name: Clear handoff
      command: memory working clear --project agent-memory
    - name: MCP set handoff
      tool: memory_working_set
      arguments:
        project: agent-memory
        content: "Current state and next step."
