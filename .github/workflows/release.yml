name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Release 2: each platform ships a single combined archive
          # containing both `memory` and `memory-dream`. The asset name
          # embeds the tag so the updater + install scripts can resolve
          # a specific release deterministically.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            memory_bin: memory.exe
            dream_bin: memory-dream.exe
            archive_suffix: windows-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            memory_bin: memory
            dream_bin: memory-dream
            archive_suffix: linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            memory_bin: memory
            dream_bin: memory-dream
            archive_suffix: linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            memory_bin: memory
            dream_bin: memory-dream
            archive_suffix: macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            memory_bin: memory
            dream_bin: memory-dream
            archive_suffix: macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux release binaries must not inherit the moving hosted runner's
      # glibc. Build inside Debian 12 (glibc 2.36), the oldest baseline that
      # also satisfies FastEmbed's bundled ONNX Runtime, so the artifacts
      # remain executable on Debian 12 and newer compatible distributions.
      - name: Build workspace (Linux, glibc 2.36 baseline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env AGENT_MEMORY_VERSION \
            --env CARGO_TARGET_DIR=/workspace/target/linux-abi \
            --env CARGO_HOME=/tmp/cargo-home \
            --env HOME=/tmp \
            rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663 \
            cargo build --release --target ${{ matrix.target }} --workspace
        env:
          AGENT_MEMORY_VERSION: ${{ github.ref_name }}

      - name: Build workspace (Windows/macOS)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} --workspace
        env:
          AGENT_MEMORY_VERSION: ${{ github.ref_name }}

      - name: Resolve binary directory
        id: paths
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "src=target/linux-abi/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "src=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce Linux glibc compatibility ceiling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/check-glibc-floor.sh 2.36 \
            "${{ steps.paths.outputs.src }}/${{ matrix.memory_bin }}" \
            "${{ steps.paths.outputs.src }}/${{ matrix.dream_bin }}"

      - name: Compute archive name
        id: archive
        shell: bash
        run: |
          echo "name=agent-memory-${{ matrix.archive_suffix }}" >> $GITHUB_OUTPUT

      - name: Package (Windows — combined .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "${{ steps.paths.outputs.src }}"
          Compress-Archive -Path "$src/${{ matrix.memory_bin }}","$src/${{ matrix.dream_bin }}" `
            -DestinationPath "${{ steps.archive.outputs.name }}"

      - name: Package (Unix — combined .tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ steps.archive.outputs.name }} \
            -C ${{ steps.paths.outputs.src }} \
            ${{ matrix.memory_bin }} ${{ matrix.dream_bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
